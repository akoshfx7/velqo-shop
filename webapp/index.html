<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Velqo Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{--bg:#0C0920;--surface:#17123A;--accent:#7C5CFF;--gold:#FFC83D;--pink:#FF8FB7;--cream:#F4F1FF;--ok:#3DDC97;
--brand:linear-gradient(135deg,#2A1B5E,#5B3DF5);--line:rgba(244,241,255,.09);--mut:rgba(244,241,255,.62);
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:400 15px/1.45 Inter,system-ui,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,rgba(91,61,245,.28),transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3,.num{font-family:Outfit,Inter,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:480px;margin:0 auto;padding:calc(var(--sat) + 12px) 16px calc(88px + var(--sab))}
.head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font:700 20px Outfit;flex:1}
.bal{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--surface);border:1px solid var(--line);font:700 15px Outfit}
.bal svg{color:var(--gold)}
.ava{width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font:700 16px Outfit;border:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.hero{background:var(--brand);border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.hero h1{font-size:26px;font-weight:700;line-height:1.15;max-width:230px}
.hero p{margin:8px 0 0;color:rgba(244,241,255,.78);max-width:240px}
.hero .big{position:absolute;right:-18px;top:-10px;color:var(--gold);opacity:.95}
.sec{font:600 13px Inter;color:var(--mut);margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pill{min-height:64px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-align:left;transition:border-color .15s,background .15s}
.pill b{display:flex;align-items:center;gap:6px;font:700 17px Outfit}.pill b svg{color:var(--gold)}
.pill small{color:var(--mut);font-size:13px}
.pill.on{border-color:var(--accent);background:rgba(124,92,255,.16)}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);color:var(--cream);font:500 16px Inter;outline:0}
.field:focus,.pill:focus-visible,.cta:focus-visible,.seg button:focus-visible,.tab:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.35);outline:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--surface);border-radius:16px;border:1px solid var(--line)}
.seg button{min-height:44px;border-radius:12px;font-weight:600;color:var(--mut)}.seg button.on{background:var(--brand);color:#fff}
.total{display:flex;justify-content:space-between;align-items:center}
.total .num{font-size:28px;font-weight:700}
.cta{width:100%;min-height:52px;border-radius:16px;background:var(--brand);color:#fff;font:700 16px Outfit;border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px rgba(91,61,245,.35)}
.cta[disabled]{opacity:.5}.ghost{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);color:var(--cream);font-weight:600}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chip{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(255,200,61,.14);color:var(--gold)}
.chip.done,.chip.approved{background:rgba(61,220,151,.14);color:var(--ok)}.chip.cancelled,.chip.rejected{background:rgba(255,143,183,.14);color:var(--pink)}
.mut{color:var(--mut)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}
.prem{display:flex;justify-content:space-between;align-items:center;width:100%;padding:16px;border-radius:20px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:10px;text-align:left}
.prem.on{border-color:var(--accent);background:rgba(124,92,255,.16)}.prem .num{font-size:22px;font-weight:700}
.tag{font-size:12px;font-weight:700;color:#2A1B5E;background:var(--gold);border-radius:10px;padding:2px 8px;margin-left:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + var(--sab));background:rgba(12,9,32,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);border-radius:14px;position:relative}
.tab.on{color:#B7A5FF}.tab.on::before{content:"";position:absolute;top:-9px;width:28px;height:3px;border-radius:3px;background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sab));max-width:440px;width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--cream);color:#1a1240;font-weight:600;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.err{background:var(--pink)}
.sk{height:64px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--surface),#211a4d,var(--surface));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.card a{display:block}.field[data-p]{min-height:44px;padding:0 10px;margin-top:4px}
.empty{text-align:center;padding:36px 12px;color:var(--mut)}.empty svg{color:var(--accent);margin-bottom:8px}
.copy{display:flex;align-items:center;justify-content:space-between;gap:8px}.copy b{font:700 18px Outfit;letter-spacing:.5px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.quick .pill{min-height:44px;padding:0 14px;white-space:nowrap;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
